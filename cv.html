const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ul = items => '<ul>' + items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';

function render(dirId){
  const d = D.directions[dirId], p = D.profile;
  const LIGHT = {embedded:['#1d4ed8','#eef2ff'],hardware:['#0e7490','#ecfeff'],ai:['#6d28d9','#f5f3ff']};
  const theme = LIGHT[dirId] || [d.accent, d.accent_soft];
  document.documentElement.style.setProperty('--accent', theme[0]);
  document.documentElement.style.setProperty('--accent-soft', theme[1]);
  document.getElementById('brand').innerHTML = esc(p.name) + '<small>Portfolio · ' + esc(p.grad.replace(' 届','')) + '</small>';
  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('headline').innerHTML = d.headline.split('\n').map(esc).join('<span class="br"></span>');
  document.getElementById('en').textContent = p.name_en + ' / ' + d.en;
  document.getElementById('lead').textContent = d.lead;
  document.getElementById('metrics').innerHTML = d.metrics.map(m =>
    '<div class="metric"><div class="v">' + esc(m[0]) + '</div><div class="l">' + esc(m[1]) + '</div></div>').join('');

  document.getElementById('skills').innerHTML = d.skills.map(([g, items]) =>
    '<div class="skill-row"><div class="skill-k">' + esc(g) + '</div><div class="tags">' +
    items.map(i => '<span class="tag">' + esc(i) + '</span>').join('') + '</div></div>').join('');

  document.getElementById('projects').innerHTML = d.projects.map((k, i) => {
    const it = D.projects[k], v = it.variants[dirId];
    return '<div class="proj"><div class="proj-side"><div class="no">P' + String(i+1).padStart(2,'0') +
      '</div>' + esc(it.period) + '</div><div class="proj-body"><h3>' + esc(it.title) +
      '</h3><div class="proj-kind">' + esc(it.kind) + '</div>' + ul(v) +
      (it.stack && it.stack.length ? '<div class="proj-stack">' + it.stack.map(s => '<span class="chip">' + esc(s) + '</span>').join('') + '</div>' : '') +
      '</div></div>';
  }).join('');

  document.getElementById('experience').innerHTML = d.experience.map(k => {
    const it = D.internships[k], v = it.variants[dirId];
    return '<div class="tl-item"><div class="tl-head"><span class="tl-org">' + esc(it.org) +
      '</span><span class="tl-role">' + esc(it.role) + '</span><span class="tl-period">' + esc(it.period) +
      '</span></div><div class="tl-place">' + esc(it.tag ? it.tag + ' · ' : '') + esc(it.place) +
      '</div>' + ul(v) + '</div>';
  }).join('');

  const e = D.edu;
  document.getElementById('edu').innerHTML =
    '<div><h3>' + esc(e.school) + '</h3><div class="sub">' + esc(e.college) + ' · ' + esc(e.major) +
    '</div><div class="sub">' + esc(e.period) + '</div></div><div class="cols"><div><div class="fk" style="width:auto;color:#98a1ad">' +
    esc(e.note) + '</div><div class="tags" style="margin-top:6px">' + e.courses.map(c => '<span class="tag">' + esc(c) + '</span>').join('') +
    '</div></div></div>';
  document.getElementById('closing').textContent = d.closing;

  const email = document.getElementById('email');
  email.textContent = p.email; email.href = 'mailto:' + p.email;
  const gh = document.getElementById('gh');
  gh.textContent = 'github.com/' + p.github; gh.href = 'https://github.com/' + p.github;
  document.getElementById('city').textContent = p.city;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === dirId));
}

document.getElementById('tabs').innerHTML = D.order.map(k =>
  '<button class="tab" data-id="' + k + '">' + esc(D.directions[k].name) + '</button>').join('');
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => render(t.dataset.id)));
render(D.order[0]);
