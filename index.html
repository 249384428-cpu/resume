<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>符振信 · 在线简历</title>
<style>
  :root{
    --bg:#06080f; --ink:#eef2f9; --sub:#7d889c; --accent:#6f9bff; --accent2:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;position:relative;
  }
  /* 底部渐变氛围 */
  .veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 50% 118%,rgba(79,110,220,.16),transparent 70%),
               radial-gradient(ellipse 60% 50% at 50% -18%,rgba(120,80,220,.12),transparent 70%);}
  /* 精致光晕：更慢、更淡 */
  .glow{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
  .g1{width:600px;height:600px;background:radial-gradient(circle,rgba(58,110,255,.18),transparent 70%);top:-220px;left:calc(50% - 400px);animation:drift1 20s ease-in-out infinite}
  .g2{width:560px;height:560px;background:radial-gradient(circle,rgba(150,96,246,.15),transparent 70%);bottom:-240px;right:calc(50% - 380px);animation:drift2 22s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,28px) scale(1.08)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-38px,-22px) scale(1.06)}}
  /* 顶部细线 */
  .topline{position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(130,160,255,.45),transparent);}
  /* 内容 */
  .stage{position:relative;z-index:2;text-align:center;padding:24px;max-width:840px}
  .badge{
    display:inline-flex;align-items:center;gap:9px;margin:0 0 30px;
    padding:7px 16px;border-radius:100px;font-size:11.5px;letter-spacing:2px;color:#b9c8e6;
    border:1px solid rgba(140,168,235,.22);background:rgba(255,255,255,.025);
    backdrop-filter:blur(8px);
    opacity:0;animation:rise 1s .05s ease forwards;
  }
  .badge .spark{width:5px;height:5px;border-radius:50%;background:#8fb0ff;box-shadow:0 0 10px #8fb0ff}
  .name{font-size:clamp(56px,12vw,124px);font-weight:750;letter-spacing:10px;margin:0;line-height:1.02;
    background:linear-gradient(105deg,#ffffff 8%,#b9cdff 38%,#d6baff 66%,#ffffff 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:220% auto;animation:shine 8s linear infinite,rise 1.1s .15s ease both;}
  @keyframes shine{to{background-position:220% center}}
  .name-en{font-size:12.5px;letter-spacing:12px;color:#6f7a90;margin:16px 0 0;
    opacity:0;animation:rise 1s .4s ease forwards}
  .rule{width:1px;height:30px;margin:26px auto 0;
    background:linear-gradient(180deg,transparent,rgba(150,175,240,.7),transparent);
    opacity:0;animation:rise 1s .5s ease forwards}
  .line{font-size:clamp(15px,2.3vw,19px);color:#c2cde0;font-weight:400;letter-spacing:1.5px;margin:0;
    opacity:0;animation:rise 1s .62s ease forwards}
  .line b{color:#fff;font-weight:600}
  .enter{
    display:inline-flex;align-items:center;gap:13px;margin-top:34px;
    padding:15px 36px;border-radius:100px;cursor:pointer;text-decoration:none;
    font-size:14.5px;font-weight:600;letter-spacing:3px;color:#eaf0ff;
    background:linear-gradient(100deg,rgba(103,145,255,.14),rgba(167,139,250,.14));
    border:1px solid rgba(150,175,245,.38);
    backdrop-filter:blur(10px);
    opacity:0;animation:rise 1s .85s ease forwards;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,box-shadow .3s ease,background .3s ease;
  }
  .enter:hover{transform:translateY(-3px);border-color:rgba(180,200,255,.75);
    background:linear-gradient(100deg,rgba(103,145,255,.24),rgba(167,139,250,.24));
    box-shadow:0 14px 46px rgba(90,130,255,.22),inset 0 0 22px rgba(150,180,255,.1)}
  .enter .dot{width:6px;height:6px;border-radius:50%;background:#9fbcff;box-shadow:0 0 12px #9fbcff}
  .enter svg{width:16px;height:16px;transition:transform .3s ease}
  .enter:hover svg{transform:translateX(5px)}
  .foot{position:absolute;bottom:64px;width:100%;text-align:center;z-index:2;color:#5c6880;font-size:10.5px;letter-spacing:3px;
    opacity:0;animation:rise 1s 1.15s ease forwards}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
  <div class="topline"></div>
  <div class="veil"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="stage">
    <p class="badge"><span class="spark"></span>海南大学 · 电子信息工程 · 2027 届</p>
    <h1 class="name">符振信</h1>
    <p class="name-en">FU ZHENXIN</p>
    <div class="rule"></div>
    <a class="enter" href="cv.html">
      <span class="dot"></span>进入简历
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>
    </a>
  </div>

  <div class="foot">海南大学 · CLASS OF 2027</div>
</body>
</html>
